name: Seed Terrabar city directory

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261017143000_seed_market_cities_and_neighbors.sql"
      - ".github/workflows/seed-terrabar-city-directory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabar-production-city-directory
  cancel-in-progress: false

jobs:
  seed-city-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require existing-project credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link to the existing Terrabar Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref gznsxqeyhnuzglliijzz --password "$SUPABASE_DB_PASSWORD"

      - name: Apply the reviewed idempotent city seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db query --linked --file supabase/migrations/20261017143000_seed_market_cities_and_neighbors.sql
