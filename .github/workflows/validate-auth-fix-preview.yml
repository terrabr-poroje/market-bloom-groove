name: Validate and preview auth loading fix

on:
  pull_request:
    branches:
      - main
      - cloudflare-workers-migration
    paths:
      - "src/lib/auth.ts"
      - ".github/workflows/validate-auth-fix-preview.yml"

permissions:
  contents: read

concurrency:
  group: terrabar-auth-fix-preview
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed fix
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build with approved Supabase project
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Convert build config to preview-only target
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.name !== 'terrabar-market') {
            throw new Error('Unexpected source Worker config: ' + config.name);
          }
          config.name = 'terrabar-market-preview';
          config.routes = [];
          config.workers_dev = true;
          if (config.env) delete config.env;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Verified preview-only config: terrabar-market-preview, no custom domain routes.');
          NODE

      - name: Deploy to preview Worker only
        run: bunx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test preview routes
        run: |
          set -euo pipefail
          for route in / /auth /announce /requests; do
            code="$(curl --silent --show-error --output /tmp/page.html --write-out '%{http_code}' --retry 5 --retry-delay 2 --retry-connrefused "https://terrabar-market-preview.rahavard.workers.dev${route}")"
            if [ "$code" != "200" ]; then
              echo "::error::Preview route ${route} returned HTTP ${code}"
              head -c 500 /tmp/page.html || true
              exit 1
            fi
            grep -q 'ترابار' /tmp/page.html || {
              echo "::error::Preview route ${route} did not return the expected Terrabar page."
              exit 1
            }
            echo "PASS ${route}: HTTP 200 with Terrabar content"
          done
