name: Verify Cloudflare Workers migration

on:
  push:
    branches:
      - cloudflare-workers-migration
    paths-ignore:
      - "bun.lock"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "src/**"
      - ".github/workflows/verify-cloudflare-migration.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies and refresh lockfile
        run: bun install
      - name: Build application
        run: bun run build
      - name: Commit refreshed lockfile on migration branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh bun lockfile for Cloudflare migration"
            git push
          fi
