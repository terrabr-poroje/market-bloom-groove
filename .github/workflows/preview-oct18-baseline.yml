name: Deploy October 18 baseline to isolated preview

on:
  push:
    branches:
      - rebuild/oct18-release-baseline-2026-10-20
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - ".github/workflows/preview-oct18-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabar-oct18-baseline-preview
  cancel-in-progress: false

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout October 18 baseline branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate approved Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_URL:-}" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          if [ "${VITE_SUPABASE_URL%/}" != "https://gznsxqeyhnuzglliijzz.supabase.co" ]; then
            echo "::error::Refusing preview: Supabase URL is not the approved Terrabar project."
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build October 18 baseline
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Run automated tests
        run: bun run test

      - name: Force preview-only Worker configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          if (!fs.existsSync(path)) throw new Error('Preview blocked: generated Worker config missing.');
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.main) throw new Error('Preview blocked: Worker entry point missing.');
          config.name = 'terrabar-market-preview';
          config.routes = [];
          config.workers_dev = true;
          if (config.env) delete config.env;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Preview-only Worker confirmed; production routes are not configured.');
          NODE

      - name: Deploy only the preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "980efee43cd0c6512bb7ffce38e319c6"
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing Cloudflare token; no deployment made."; exit 1; }
          bunx wrangler deploy --config .output/server/wrangler.json

      - name: Smoke-test preview routes
        run: |
          set -euo pipefail
          for route in / /auth /announce /requests; do
            code="$(curl --silent --show-error --output /tmp/page.html --write-out '%{http_code}' --retry 5 --retry-delay 2 --retry-connrefused "https://terrabar-market-preview.rahavard.workers.dev${route}")"
            if [ "$code" != "200" ]; then
              echo "::error::Preview route ${route} returned HTTP ${code}"
              head -c 500 /tmp/page.html || true
              exit 1
            fi
            grep -q 'ترابار' /tmp/page.html || { echo "::error::Unexpected page at ${route}"; exit 1; }
            echo "PASS ${route}: HTTP 200 with Terrabar content"
          done
