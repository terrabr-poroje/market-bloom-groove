name: Deploy reviewed Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabar-production-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration repository before touching production
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'project_id = "gznsxqeyhnuzglliijzz"' supabase/config.toml
          files=(supabase/migrations/*.sql)
          if [ ! -e "${files[0]}" ]; then echo "No SQL migrations found."; exit 1; fi
          for file in "${files[@]}"; do
            base="$(basename "$file")"
            [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\\.sql$ ]] || { echo "Invalid migration filename: $base"; exit 1; }
            grep -q '[^[:space:]]' "$file" || { echo "Empty migration: $file"; exit 1; }
          done
          versions="$(printf '%s\\n' "${files[@]}" | sed -E 's#^.*/([0-9]{14})_.*#\\1#' | sort)"
          duplicates="$(printf '%s\\n' "$versions" | uniq -d)"
          [ -z "$duplicates" ] || { echo "Duplicate migration versions: $duplicates"; exit 1; }
          guardrails="supabase/migrations/20261015211128_membership_and_load_submission_policies.sql"
          test -f "$guardrails"
          grep -Fq 'CREATE POLICY loads_select_authorized' "$guardrails"
          grep -Fq 'CREATE POLICY loads_city_manager_review_update' "$guardrails"
          grep -Fq 'CREATE POLICY members_city_manager_read_assigned_city' "$guardrails"
          grep -Fq "mr.role_code = 'professional_buyer'" "$guardrails"
          grep -Fq "mr.role_code = 'special_buyer'" "$guardrails"
          echo "Migration structure and critical access guardrails passed."

      - name: Require repository secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing GitHub Actions secret SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link to the existing Terrabar project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref gznsxqeyhnuzglliijzz --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
