name: Capture Supabase schema drift for review

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terrabar-supabase-schema-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require repository secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing GitHub Actions secret SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link to the existing Terrabar project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref gznsxqeyhnuzglliijzz --password "$SUPABASE_DB_PASSWORD"

      - name: Capture current public schema (no row data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/snapshots
          supabase db dump --linked --schema public --password "$SUPABASE_DB_PASSWORD" --file supabase/snapshots/production-public-schema.sql
          supabase gen types typescript --linked --schema public > supabase/database.types.ts

      - name: Update the schema review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/supabase-schema-snapshot
          git add supabase/snapshots/production-public-schema.sql supabase/database.types.ts
          if git diff --cached --quiet; then
            echo "Supabase schema snapshot and generated types are unchanged."
            exit 0
          fi
          git commit -m "chore: capture current Supabase public schema"
          git push --force origin automation/supabase-schema-snapshot

      - name: Open a review PR when GitHub allows it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --head automation/supabase-schema-snapshot --base main --state open --json number --jq 'length')"
          if [ "$open_prs" = "0" ]; then
            gh pr create \\
              --base main \\
              --head automation/supabase-schema-snapshot \\
              --title "chore: review current Supabase schema snapshot" \\
              --body "Automated snapshot from the existing Terrabar Supabase project. Schema and generated TypeScript types only; no row data and no production SQL is applied by this PR. Review before merging. The SQL snapshot is reference-only and must not be replayed on top of the existing database." \\
              || echo "::warning::Snapshot branch updated, but GitHub repository settings currently block Actions from creating pull requests. Enable this permission to automate PR creation."
          else
            echo "An open Supabase schema review PR already exists; its branch was updated."
          fi
