name: Deploy Terrabar preview to Cloudflare Workers

on:
  push:
    branches:
      - cloudflare-workers-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build for Cloudflare Workers
        run: bun run build
      - name: Deploy temporary preview Worker
        run: bunx wrangler deploy --temporary
