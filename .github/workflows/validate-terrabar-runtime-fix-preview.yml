name: Validate and preview Terrabar production runtime fix

on:
  push:
    branches:
      - fix/terrabar-production-runtime-2026-11-07
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabar-runtime-fix-preview
  cancel-in-progress: false

jobs:
  build-test-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_URL:-}" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing Cloudflare deployment token"; exit 1; }
          test "${VITE_SUPABASE_URL%/}" = "https://gznsxqeyhnuzglliijzz.supabase.co" || { echo "::error::Wrong Supabase project"; exit 1; }

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build candidate using the real Supabase client
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Lint and run automated tests
        run: |
          bun run lint
          bun run test

      - name: Configure isolated preview Worker
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          if (!fs.existsSync(path)) throw new Error('Build did not generate the Cloudflare Worker config.');
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.main) throw new Error('Generated Worker entry point is missing.');
          config.name = 'terrabar-market-preview';
          config.routes = [];
          config.workers_dev = true;
          if (config.env) delete config.env;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          const check = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (check.name !== 'terrabar-market-preview' || (check.routes || []).length !== 0 || !check.workers_dev) {
            throw new Error('Preview isolation check failed.');
          }
          console.log('Preview-only config verified. Production domains and Worker are untouched.');
          NODE

      - name: Deploy only the preview Worker
        run: bunx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '980efee43cd0c6512bb7ffce38e319c6'

      - name: Smoke-test preview HTML and application assets
        run: |
          set -euo pipefail
          base='https://terrabar-market-preview.rahavard.workers.dev'
          for route in / /auth /requests /cart; do
            curl --fail --silent --show-error --retry 6 --retry-delay 3 "$base$route" -o /tmp/page.html
            grep -q 'ترابار' /tmp/page.html
            grep -qE '<script[^>]+type="module"|modulepreload' /tmp/page.html
            echo "PASS HTML $route"
          done
          index_asset="$(grep -aoE 'src="[^"]+\\.js"' /tmp/page.html | head -1 | cut -d '"' -f2)"
          test -n "$index_asset"
          curl --fail --silent --show-error "$base$index_asset" -o /tmp/index.js
          client_asset="$(grep -aoE 'client-[A-Za-z0-9_-]+\\.js' /tmp/index.js | head -1)"
          test -n "$client_asset"
          curl --fail --silent --show-error "$base/assets/$client_asset" -o /tmp/client.js
          grep -aq 'supabase-js.traceContextExtractor' /tmp/client.js
          if grep -aq 'tb_tbl_' /tmp/client.js; then
            echo "::error::Preview bundle contains the old localStorage mock database."
            exit 1
          fi
          echo "PASS real Supabase client bundle; mock localStorage database is absent"

      - name: Verify Chromium and Safari-WebKit navigation and hydration
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
          node <<'NODE'
          const { chromium, webkit } = require('playwright');
          (async () => {
            const base = 'https://terrabar-market-preview.rahavard.workers.dev';
            for (const [name, engine] of [['Chromium', chromium], ['WebKit', webkit]]) {
              const browser = await engine.launch({ headless: true });
              const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true });
              const pageErrors = [];
              const failedScripts = [];
              page.on('pageerror', e => pageErrors.push(e.message));
              page.on('requestfailed', r => { if (/\.m?js($|\?)/.test(r.url())) failedScripts.push(r.url() + ' ' + r.failure()?.errorText); });
              const response = await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 60000 });
              if (!response || !response.ok()) throw new Error(name + ': homepage failed');
              await page.getByRole('link', { name: /شروع همکاری/ }).click();
              await page.waitForURL('**/auth', { timeout: 15000 });
              const signupTab = page.getByRole('button', { name: 'ثبت‌نام', exact: true }).first();
              await signupTab.click();
              if (!(await page.getByPlaceholder('نام کامل شما').isVisible())) {
                throw new Error(name + ': signup button did not reveal the registration form');
              }
              await page.getByRole('button', { name: 'ورود', exact: true }).click();
              if (await page.getByPlaceholder('نام کامل شما').isVisible()) {
                throw new Error(name + ': login button did not switch the form');
              }
              await page.goto(base + '/requests', { waitUntil: 'networkidle', timeout: 60000 });
              if (!(await page.locator('body').innerText()).includes('ترابار')) throw new Error(name + ': requests page content missing');
              if (pageErrors.length || failedScripts.length) throw new Error(name + ': page errors=' + JSON.stringify(pageErrors) + ' failed scripts=' + JSON.stringify(failedScripts));
              console.log('PASS ' + name + ': JS hydrated, links navigate, requests page rendered');
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
