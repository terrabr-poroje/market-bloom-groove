name: Build and deploy Terrabar to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/deploy-terrabar-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabar-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production app
        run: npm run build

      - name: Verify Cloudflare build output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public
          echo "Build output verified."

      - name: Deploy existing Terrabar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 980efee43cd0c6512bb7ffce38e319c6
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing. Production was not changed."
            exit 1
          fi
          npx --yes wrangler@4 deploy .output/server/index.mjs \
            --assets .output/public \
            --name terrabar-market \
            --compatibility-date 2026-10-17 \
            --keep-vars

      - name: Smoke-test production routes
        run: |
          set -e
          for path in / /auth /announce /requests; do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://terrabar.ir$path")
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done
