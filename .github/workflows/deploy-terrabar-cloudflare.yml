name: Build and deploy Terrabar to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - ".github/workflows/deploy-terrabar-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabar-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate approved Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Production was not changed."
              exit 1
            fi
          done
          if [ "${VITE_SUPABASE_URL%/}" != "https://gznsxqeyhnuzglliijzz.supabase.co" ]; then
            echo "::error::Refusing deployment: Supabase URL is not the approved Terrabar project."
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify generated Cloudflare Worker config
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          if (!fs.existsSync(path)) {
            throw new Error('Refusing deployment: generated Cloudflare Worker config is missing.');
          }
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.main) {
            throw new Error('Refusing deployment: generated Worker entry point is missing.');
          }
          config.name = 'terrabar-market';
          config.routes = [
            { pattern: 'terrabar.ir', custom_domain: true },
            { pattern: 'www.terrabar.ir', custom_domain: true }
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Verified generated Worker config for terrabar-market.');
          NODE

      - name: Deploy existing Terrabar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "980efee43cd0c6512bb7ffce38e319c6"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing Cloudflare API token secret. Production was not changed."
            exit 1
          fi
          bunx wrangler deploy --config .output/server/wrangler.json

      - name: Smoke-test production routes
        run: |
          set -euo pipefail
          for base in https://terrabar.ir https://www.terrabar.ir; do
            for route in / /auth /announce /requests; do
              status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 2 "$base$route")"
              echo "$base$route -> HTTP $status"
              test "$status" = "200"
            done
          done
