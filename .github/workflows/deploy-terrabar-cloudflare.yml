name: Terrabar — verify and deploy production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - "vitest.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - "src/test/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-terrabar-cloudflare.yml"
      - "scripts/browser-smoke.mjs"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - "wrangler.toml"
      - ".github/workflows/deploy-terrabar-cloudflare.yml"
      - "scripts/browser-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

# Serialize actual production deployments, but let PR diagnostics run independently.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('terrabar-pr-{0}', github.event.pull_request.number) || 'terrabar-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, unit tests and real-browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact commit being verified
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate approved Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Production was not changed."
              exit 1
            fi
          done
          if [ "${VITE_SUPABASE_URL%/}" != "https://gznsxqeyhnuzglliijzz.supabase.co" ]; then
            echo "::error::Refusing deployment: Supabase URL is not the approved Terrabar project."
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint application
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build production app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify generated Cloudflare Worker config
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          if (!fs.existsSync(path)) throw new Error('Generated Cloudflare Worker config is missing.');
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.main) throw new Error('Generated Worker entry point is missing.');
          config.name = 'terrabar-market';
          config.routes = [
            { pattern: 'terrabar.ir', custom_domain: true },
            { pattern: 'www.terrabar.ir', custom_domain: true }
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Verified generated Worker config for terrabar-market.');
          NODE

      - name: Install browser-test runner without changing project manifests
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --legacy-peer-deps playwright
          npx playwright install --with-deps chromium webkit

      - name: Start the built Worker locally
        run: |
          set -euo pipefail
          bunx wrangler dev --config .output/server/wrangler.json --local --port 8787 --ip 127.0.0.1 > /tmp/terrabar-wrangler.log 2>&1 &
          echo $! > /tmp/terrabar-wrangler.pid
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then
              echo "Local built Worker is responding."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/terrabar-wrangler.log
          echo "::error::Built Worker did not become ready for browser testing."
          exit 1

      - name: Test real browser rendering, JavaScript and route navigation
        run: node scripts/browser-smoke.mjs
        env:
          BROWSER_TEST_BASE_URL: http://127.0.0.1:8787

      - name: Diagnose the current live homepage in a real browser (read-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/browser-smoke.mjs
        env:
          BROWSER_TEST_BASE_URL: https://terrabar.ir

      - name: Stop local Worker
        if: always()
        run: |
          if [ -f /tmp/terrabar-wrangler.pid ]; then kill "$(cat /tmp/terrabar-wrangler.pid)" 2>/dev/null || true; fi

  deploy:
    name: Deploy the verified commit to the existing Worker
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact commit that passed verification
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rebuild the verified commit
        run: bun install --frozen-lockfile && bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify approved Supabase project before deployment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '980efee43cd0c6512bb7ffce38e319c6' }}
        run: |
          set -euo pipefail
          test "${VITE_SUPABASE_URL%/}" = "https://gznsxqeyhnuzglliijzz.supabase.co"
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Configure and verify only the existing Terrabar domains
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.main) throw new Error('Generated Worker entry point is missing.');
          config.name = 'terrabar-market';
          config.routes = [
            { pattern: 'terrabar.ir', custom_domain: true },
            { pattern: 'www.terrabar.ir', custom_domain: true }
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Deploy existing Terrabar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '980efee43cd0c6512bb7ffce38e319c6' }}
        run: bunx wrangler deploy --config .output/server/wrangler.json

      - name: Smoke-test production routes on both domains
        run: |
          set -euo pipefail
          for base in https://terrabar.ir https://www.terrabar.ir; do
            for route in / /auth /announce /requests /admin-login /reset-password; do
              result="$(curl --silent --show-error --location --output /tmp/terrabar.html --write-out '%{http_code} %{time_total}' --retry 5 --retry-delay 2 --retry-connrefused "${base}${route}")"
              code="${result%% *}"
              elapsed="${result##* }"
              if [ "$code" != "200" ]; then
                echo "::error::${base}${route} returned HTTP $code after ${elapsed}s"
                head -c 500 /tmp/terrabar.html || true
                exit 1
              fi
              echo "PASS ${base}${route}: HTTP 200, ${elapsed}s"
            done
            grep -q 'ترابار' /tmp/terrabar.html || {
              echo "::error::${base} response did not contain expected Terrabar page text."
              exit 1
            }
          done
