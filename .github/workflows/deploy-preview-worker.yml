# Isolated preview deployment only. No custom domains or production Worker routes.
name: Deploy Terrabar isolated preview

on:
  workflow_dispatch:
  push:
    branches:
      - terrabar-repair-preview
    paths:
      - ".github/workflows/deploy-preview-worker.yml"
      - "src/**"
      - "app/**"
      - "public/**"
      - "package.json"
      - "bun.lock*"
      - "vite.config.ts"
      - "wrangler.preview.jsonc"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: terrabar-isolated-preview
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate approved Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          VITE_SUPABASE_URL="${VITE_SUPABASE_URL%/}"
          if [ "$VITE_SUPABASE_URL" != "https://gznsxqeyhnuzglliijzz.supabase.co" ]; then
            echo "::error::VITE_SUPABASE_URL must point to the approved Terrabar Supabase project."
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy isolated preview Worker (no custom domain)
        run: bunx wrangler deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
