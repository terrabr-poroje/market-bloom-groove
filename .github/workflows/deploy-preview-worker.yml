# Isolated preview deployment only. The generated config is copied with production routes removed.
name: Deploy Terrabar isolated preview

on:
  workflow_dispatch:
  push:
    branches:
      - terrabar-repair-preview
    paths:
      - ".github/workflows/deploy-preview-worker.yml"
      - "src/**"
      - "app/**"
      - "public/**"
      - "package.json"
      - "bun.lock*"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: terrabar-isolated-preview
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate approved Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          VITE_SUPABASE_URL="${VITE_SUPABASE_URL%/}"
          if [ "$VITE_SUPABASE_URL" != "https://gznsxqeyhnuzglliijzz.supabase.co" ]; then
            echo "::error::VITE_SUPABASE_URL must point to the approved Terrabar Supabase project."
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create isolated preview config from the Vite-generated Worker config
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = 'terrabar-market-preview';
          delete config.routes;
          delete config.route;
          delete config.env;
          config.workers_dev = true;
          fs.writeFileSync('dist/server/wrangler.preview.json', JSON.stringify(config, null, 2));
          const verify = JSON.parse(fs.readFileSync('dist/server/wrangler.preview.json', 'utf8'));
          if (verify.name !== 'terrabar-market-preview' || verify.routes || verify.route || verify.env) {
            throw new Error('Preview config safety check failed');
          }
          console.log('Preview config verified: separate Worker name; no production routes or environments.');
          NODE

      - name: Deploy isolated preview Worker (no custom domain)
        run: bunx wrangler deploy --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
