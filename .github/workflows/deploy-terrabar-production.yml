# Deploy only the exact Terrabar release candidate after a clean build and route smoke tests.
name: Deploy approved Terrabar production release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terrabar-production-deployment
  cancel-in-progress: false

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact commit pushed to main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "980efee43cd0c6512bb7ffce38e319c6"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing Cloudflare API token secret (CLOUDFLARE_API_TOKEN or LOUDFLARE_API_TOKEN)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing Cloudflare account ID."
            exit 1
          fi

      - name: Validate approved Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          VITE_SUPABASE_URL="${VITE_SUPABASE_URL%/}"
          if [ "$VITE_SUPABASE_URL" != "https://gznsxqeyhnuzglliijzz.supabase.co" ]; then
            echo "::error::Refusing deployment: Supabase URL is not the approved Terrabar project."
            exit 1
          fi

      - name: Verify existing Supabase phone OTP delivery path (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Cannot verify the existing Supabase SMS configuration; refusing to replace the live login path."; exit 1; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/gznsxqeyhnuzglliijzz/config/auth" \
            -o /tmp/terrabar-auth-config.json
          node <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('/tmp/terrabar-auth-config.json', 'utf8'));
          const hook = c.hook_send_sms_enabled === true &&
            typeof c.hook_send_sms_uri === 'string' && c.hook_send_sms_uri.length > 0 &&
            typeof c.hook_send_sms_secrets === 'string' && c.hook_send_sms_secrets.length > 0;
          const provider = String(c.sms_provider || '').toLowerCase();
          const providerReady =
            (provider === 'twilio' && !!(c.sms_twilio_account_sid && c.sms_twilio_auth_token && (c.sms_twilio_message_service_sid || c.sms_twilio_content_sid))) ||
            (provider === 'messagebird' && !!(c.sms_messagebird_access_key && c.sms_messagebird_originator)) ||
            (provider === 'textlocal' && !!(c.sms_textlocal_api_key && c.sms_textlocal_sender)) ||
            (provider === 'vonage' && !!(c.sms_vonage_api_key && c.sms_vonage_api_secret && c.sms_vonage_from));
          if (!hook && !providerReady) {
            throw new Error('Supabase phone OTP has no confirmed SMS hook/provider configuration. Production deployment blocked to avoid breaking login.');
          }
          console.log(hook ? 'Verified: Supabase send-SMS Auth Hook is configured.' : 'Verified: Supabase SMS provider ' + provider + ' has required credentials.');
          NODE

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build release candidate
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure and verify the existing production Worker
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.main) {
            throw new Error('Refusing deployment: generated Worker entry point is missing.');
          }
          // The live domains are already attached as Cloudflare Custom Domains to terraba-arash.
          // Deploy to that exact Worker; do not create overlapping route rules or a second production Worker.
          config.name = 'terraba-arash';
          config.routes = [];
          config.workers_dev = false;
          config.compatibility_date = '2026-11-02';
          config.compatibility_flags = ['nodejs_compat'];
          // Preserve the existing D1 binding without running migrations or changing its data.
          config.d1_databases = [{
            binding: 'DB',
            database_name: 'traabar-db',
            database_id: '9da7735b-e4c9-4f7f-9abe-53ba1545c60e'
          }];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          const verified = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (verified.name !== 'terraba-arash' || (verified.routes || []).length !== 0 || verified.workers_dev !== false) {
            throw new Error('Refusing deployment: production Worker identity or route isolation check failed.');
          }
          if (!(verified.d1_databases || []).some(db => db.binding === 'DB' && db.database_id === '9da7735b-e4c9-4f7f-9abe-53ba1545c60e')) {
            throw new Error('Refusing deployment: existing D1 binding was not preserved.');
          }
          console.log('Verified: existing terraba-arash Worker, existing D1 binding, and no duplicate route rules. Custom Domains remain attached separately.');
          NODE

      - name: Deploy to the existing production Worker
        run: bunx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "980efee43cd0c6512bb7ffce38e319c6"

      - name: Verify existing production Custom Domain bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/980efee43cd0c6512bb7ffce38e319c6/workers/domains" \
            -o /tmp/terrabar-domains.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/terrabar-domains.json', 'utf8'));
          if (!payload.success) throw new Error('Could not verify production Custom Domains.');
          for (const hostname of ['terrabar.ir', 'www.terrabar.ir']) {
            const domain = (payload.result || []).find(item => item.hostname === hostname && item.service === 'terraba-arash' && item.environment === 'production' && item.enabled);
            if (!domain) throw new Error('Existing Custom Domain is not attached to terraba-arash: ' + hostname);
          }
          console.log('PASS: both existing Custom Domains remain attached to terraba-arash.');
          NODE

      - name: Verify production routes and real Supabase client
        run: |
          set -euo pipefail
          for base in https://terrabar.ir https://www.terrabar.ir; do
            for route in / /auth /announce /requests /cart /professional-purchase; do
              result="$(curl --silent --show-error --output /tmp/terrabar-production.html --write-out '%{http_code} %{time_total}' --retry 5 --retry-delay 2 --retry-connrefused "${base}${route}")"
              code="${result%% *}"
              elapsed="${result##* }"
              if [ "$code" != "200" ]; then
                echo "::error::${base}${route} returned HTTP ${code} after ${elapsed}s"
                head -c 500 /tmp/terrabar-production.html || true
                exit 1
              fi
              grep -aq 'ترابار' /tmp/terrabar-production.html || {
                echo "::error::${base}${route} response did not contain expected Terrabar page text."
                exit 1
              }
            done
            index_asset="$(grep -aoE 'src="[^"]+\.js"' /tmp/terrabar-production.html | head -1 | cut -d '"' -f2)"
            test -n "$index_asset"
            curl --fail --silent --show-error "${base}${index_asset}" -o /tmp/terrabar-index.js
            client_asset="$(grep -aoE 'client-[A-Za-z0-9_-]+\.js' /tmp/terrabar-index.js | head -1)"
            test -n "$client_asset"
            curl --fail --silent --show-error "${base}/assets/${client_asset}" -o /tmp/terrabar-client.js
            grep -aq 'supabase-js.traceContextExtractor' /tmp/terrabar-client.js
            if grep -aq 'tb_tbl_' /tmp/terrabar-client.js; then
              echo "::error::Production still serves the old mock localStorage backend."
              exit 1
            fi
            echo "PASS ${base}: routes and real Supabase client verified"
          done
