# Deploy only the already-tested Terrabar release candidate to the existing production Worker.
# This workflow intentionally pins the source commit that passed preview build + route smoke tests.
name: Deploy approved Terrabar production release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-terrabar-production.yml"

permissions:
  contents: read

concurrency:
  group: terrabar-production-deployment
  cancel-in-progress: false

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact release candidate tested on preview
        uses: actions/checkout@v4
        with:
          ref: a196b75f6e01fc3c9219a7e7ee94f48e0f19f1ec

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate approved Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          VITE_SUPABASE_URL="${VITE_SUPABASE_URL%/}"
          if [ "$VITE_SUPABASE_URL" != "https://gznsxqeyhnuzglliijzz.supabase.co" ]; then
            echo "::error::Refusing deployment: Supabase URL is not the approved Terrabar project."
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build release candidate
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify production target and domain routes
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.name !== 'terrabar-market') {
            throw new Error('Refusing deployment: unexpected Worker name ' + config.name);
          }
          const routes = config.routes || [];
          for (const hostname of ['terrabar.ir', 'www.terrabar.ir']) {
            if (!routes.some(route => route.pattern === hostname && route.custom_domain === true)) {
              throw new Error('Refusing deployment: expected existing custom domain route missing: ' + hostname);
            }
          }
          if (routes.some(route => !['terrabar.ir', 'www.terrabar.ir'].includes(route.pattern))) {
            throw new Error('Refusing deployment: unexpected route found in production config');
          }
          console.log('Verified: existing Worker terrabar-market and only the two approved hostnames.');
          NODE

      - name: Deploy to the existing production Worker
        run: bunx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production routes return the Terrabar page
        run: |
          set -euo pipefail
          for base in https://terrabar.ir https://www.terrabar.ir; do
            for route in / /auth /announce /requests; do
              result="$(curl --silent --show-error --output /tmp/terrabar-production.html --write-out '%{http_code} %{time_total}' --retry 5 --retry-delay 2 --retry-connrefused "${base}${route}")"
              code="${result%% *}"
              elapsed="${result##* }"
              if [ "$code" != "200" ]; then
                echo "::error::${base}${route} returned HTTP ${code} after ${elapsed}s"
                head -c 500 /tmp/terrabar-production.html || true
                exit 1
              fi
              echo "PASS ${base}${route}: HTTP 200, ${elapsed}s"
            done
            grep -q 'ترابار' /tmp/terrabar-production.html || {
              echo "::error::${base} response did not contain expected Terrabar page text."
              exit 1
            }
          done
