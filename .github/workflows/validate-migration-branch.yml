name: Validate migration branch

on:
  push:
    branches:
      - migration/cloudflare-d1-completion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, build, lint and test (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      # Public build-time placeholders only. This workflow must not need live
      # Supabase credentials and must never connect to production services.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: migration-build-placeholder
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
